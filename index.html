<style>
  :root {
    --background: 240 20% 98%;
    --foreground: 240 10% 10%;
    --ink: 0 0% 9%;
    --surface: 0 0% 100%;
    --muted: 220 14% 96%;
    --line: 220 14% 94%;
    --brand-dark: 0 0% 9%;
    --brand-purple: 257 100% 88%;
    --brand-orange: 17 99% 68%;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --background: 240 8% 6%;
      --foreground: 240 10% 94%;
      --ink: 0 0% 96%;
      --surface: 240 6% 11%;
      --muted: 240 6% 8%;
      --line: 240 5% 18%;
      --brand-dark: 240 6% 3%;
    }
  }
  :root[data-theme="dark"] {
    --background: 240 8% 6%;
    --foreground: 240 10% 94%;
    --ink: 0 0% 96%;
    --surface: 240 6% 11%;
    --muted: 240 6% 8%;
    --line: 240 5% 18%;
    --brand-dark: 240 6% 3%;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }

  .nav-link { color: rgb(255 255 255 / .7); }
  .nav-link:hover { color: #fff; }
  .nav-link[aria-current="true"] { background: hsl(var(--brand-purple)); color: #171717; }

  .drawer-overlay { opacity: 0; transition: opacity .3s ease; }
  #drawer.open .drawer-overlay { opacity: 1; }
  .drawer-panel { transform: translateX(100%); transition: transform .55s cubic-bezier(.22, 1.08, .36, 1); }
  #drawer.open .drawer-panel { transform: none; }
  .drawer-link { color: rgb(255 255 255 / .7); }
  .drawer-link:hover { color: #fff; background: rgb(255 255 255 / .05); }
  .drawer-link .drawer-arrow { color: rgb(255 255 255 / .2); }
  .drawer-link:hover .drawer-arrow { color: #fff; transform: translate(4px, -4px); }
  .drawer-link[aria-current="true"] { color: hsl(var(--brand-purple)); background: transparent; }
  .drawer-link[aria-current="true"] .drawer-arrow { color: hsl(var(--brand-purple)); transform: rotate(45deg); }

  /* hero scales like a zoomed-out page: 16px at 1440px wide and up, smaller below */
  .hero { font-size: clamp(9px, 1.1111vw, 16px); }
  .hero-dome { aspect-ratio: 903 / 492; background: #C9C0E8; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }

  @keyframes enterL { from { opacity: 0; transform: translateX(-100%); } }
  @keyframes enterR { from { opacity: 0; transform: translateX(100%); } }
  .anim-left { animation: enterL 1s ease both; }
  .anim-right { animation: enterR 1s ease both; }
  .no-anim .anim-left, .no-anim .anim-right { animation: none; }

      '<div class="flex flex-col md:flex-row justify-between items-center mb-16 border-b border-white/10 pb-12"><h2 class="text-4xl md:text-5xl font-bold tracking-tight mb-8 md:mb-0 text-center md:text-left">Let\'s Connect</h2></div>' +
      '<div class="grid grid-cols-1 md:grid-cols-4 gap-12 mb-16">' +
        '<div class="col-span-1 md:col-span-1"><div class="flex items-center gap-3 mb-8"><span class="block w-12 h-12 shrink-0">' + LOGO + '</span><span class="text-2xl font-black uppercase tracking-[0.2em] text-white">' + esc(p.fullName) + "</span></div>" +
          '<p class="text-white/40 mb-10 max-w-xs leading-[1.8] font-medium text-sm">' + esc(p.bio) + '</p><div class="flex gap-4">' + socialLinks(d, ["instagram", "linkedin"], SOC) + "</div></div>" +
        '<div class="col-span-1"><h3 class="text-lg font-bold mb-6 text-brand-orange/80">Navigation</h3><div class="flex flex-col gap-4 text-white/70">' +
          nav.map(function (n) { return '<a href="' + n[0] + '" data-scroll class="hover:text-white transition-colors w-fit">' + n[1] + "</a>"; }).join("") + "</div></div>" +
        '<div class="col-span-1"><h3 class="text-lg font-bold mb-6 text-brand-orange/80">Contact</h3><div class="flex flex-col gap-4 text-white/70 font-semibold break-words">' +
          (p.phone ? "<p>" + esc(p.phone) + "</p>" : "") + (p.email ? "<p>" + esc(p.email) + "</p>" : "") + (site ? "<p>" + esc(site) + "</p>" : "") + "</div></div>" +
      "</div>" +
      '<div class="flex flex-col md:flex-row justify-between items-center text-white/40 text-sm"><p>Copyright © ' + new Date().getFullYear() + " " + esc(p.fullName) + '. All Rights Reserved.</p><div class="flex gap-8 mt-4 md:mt-0"><a href="#home" data-scroll class="hover:text-white">User Terms &amp; Conditions</a><a href="#home" data-scroll class="hover:text-white">Privacy Policy</a></div></div>' +
      "</div></footer>";
  }

  function ownerButtonHTML() {
    if (!state.owner) return "";
    return '<button type="button" data-open-admin="" class="fixed right-4 z-[90] bg-brand-dark text-white rounded-full pl-4 pr-5 py-3 font-black text-sm flex items-center gap-2 border border-white/10 shadow-2xl hover:scale-[1.03] transition-transform focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-purple" style="bottom: calc(env(safe-area-inset-bottom, 0px) + 1.25rem);">' +
      '<span class="w-7 h-7 rounded-full bg-brand-purple text-[#171717] flex items-center justify-center">' + ICON.pencil + "</span>Admin" +
      (state.dirty ? '<span class="ml-1 text-[11px] font-bold text-brand-orange">unpublished changes</span>' : "") + "</button>";
  }

  /* ---------- render + behaviour ---------- */
  function renderSite() {
    var d = state.data, root = $("#root");
    var animate = state.firstRender && !reduceMotion && ("IntersectionObserver" in window);
    document.documentElement.classList.toggle("m-ready", animate);
    root.className = animate ? "" : "no-anim";
    root.innerHTML = headerHTML(d) + "<main>" + heroHTML(d) + servicesHTML(d) + experienceHTML(d) + projectsHTML(d) + certificatesHTML(d) + contactHTML(d) + "</main>" + footerHTML(d) + ownerButtonHTML() +
      '<div id="lightbox" hidden class="fixed inset-0 z-[150] bg-[#0b0b0c]/85 backdrop-blur-md p-4 md:p-10 flex items-center justify-center" role="dialog" aria-modal="true" aria-label="Certificate">' +
        '<button type="button" data-lb-close class="absolute right-4 w-12 h-12 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20" style="top: calc(env(safe-area-inset-top, 0px) + 1rem);" aria-label="Close">' + ic("x", "w-6 h-6") + "</button>" +
        '<figure class="lb-fig max-w-5xl w-full flex flex-col items-center gap-4"><img id="lbImg" alt="" class="max-h-[78vh] w-auto max-w-full rounded-[1.5rem] bg-white object-contain shadow-2xl"><figcaption id="lbCap" class="text-white font-bold text-center"></figcaption></figure>' +
      "</div>" +
      '<div id="toaster" class="fixed z-[300] flex flex-col gap-2 items-end" style="right: 1.5rem; bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);" aria-live="polite"></div>' +
      '<div id="svcHost"></div>';
    svc.id = null; svc.preview = -1; svc.closing = false;
    if (state.firstRender) document.title = (d.profile.fullName || "Portfolio") + " | Portfolio";
    setupMotion(animate);
    setupSpy();
    wireForm();
    state.firstRender = false;
  }

  /* framer-style "whileInView" entrances, same values as the reference */
  var MOTION = {
    section: { from: "translateY(80px)", dur: 0.8, delay: 0, amount: 0.5 },
    h1: { from: "translateY(40px)", dur: 0.7, delay: 0.1, amount: 0.6 },
    photo: { from: "translateY(80px) scale(0.9)", dur: 0.9, delay: 0.2, amount: 0.25 },
    pill: { from: "translateY(40px)", dur: 0.7, delay: 0.3, amount: 0.8 }
  };
  function setupMotion(animate) {
    $$("[data-m]").forEach(function (el) {
      if (!animate) { el.classList.add("m-in"); return; }
      var m = MOTION[el.getAttribute("data-m")];
      el.style.setProperty("--m-from", m.from);
      el.style.setProperty("--m-dur", m.dur + "s");
      el.style.setProperty("--m-delay", m.delay + "s");
      var h = el.offsetHeight || 1;
      var amount = Math.max(0.05, Math.min(m.amount, (window.innerHeight * 0.85) / h));
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { el.classList.add("m-in"); io.disconnect(); } });
      }, { threshold: amount });
      io.observe(el);
    });
  }

  /* active menu item: same band as the reference (30%-40% of the screen) */
  var spyIO = null;
  function setActive(hash) {
    state.active = hash;
    $$("[data-nav]").forEach(function (l) { l.setAttribute("aria-current", l.getAttribute("data-nav") === hash ? "true" : "false"); });
  }
  function setupSpy() {
    if (spyIO) spyIO.disconnect();
    setActive(state.active || "#home");
    if (!("IntersectionObserver" in window)) return;
    var map = { home: "#home", about: "#about", service: "#service", project: "#project", projects: (vis(state.data).project ? "#project" : "#projects"), certificates: "#certificates", contact: "#contact" };
    spyIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { var id = e.target.getAttribute("id"); if (map[id]) setActive(map[id]); } });
    }, { root: null, rootMargin: "-30% 0px -60% 0px", threshold: 0 });
    Object.keys(map).forEach(function (id) { var el = document.getElementById(id); if (el) spyIO.observe(el); });
  }

  function scrollToHash(hash) {
    var el = document.querySelector(hash);
    if (el) el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" });
  }

  /* mobile drawer */
  function openDrawer() {
    var w = $("#drawer"); if (!w) return;
    w.hidden = false;
    void w.offsetWidth;
    w.classList.add("open");
    document.body.style.overflow = "hidden";
    $("#menuBtn").setAttribute("aria-expanded", "true");
    var c = $("#drawer [data-drawer-close]:not(.drawer-overlay)"); if (c) c.focus();
  }
  function closeDrawer() {
    var w = $("#drawer"); if (!w || w.hidden) return;
    w.classList.remove("open");
    document.body.style.overflow = "";
    var b = $("#menuBtn"); if (b) b.setAttribute("aria-expanded", "false");
    setTimeout(function () { if (!w.classList.contains("open")) w.hidden = true; }, reduceMotion ? 0 : 450);
  }

  /* sonner-style toasts */
  function notify(type, msg) {
    var box = $("#toaster"); if (!box) return;
    var t = document.createElement("div");
    t.className = "toast w-[356px] max-w-[calc(100vw-3rem)] bg-white text-[#171717] border border-slate-200 rounded-lg shadow-lg px-4 py-3.5 text-[13px] font-medium flex items-center gap-2.5";
    t.innerHTML = '<span class="' + (type === "error" ? "text-rose-500" : "text-emerald-500") + '">' + ic(type === "error" ? "alert" : "check", "w-5 h-5") + "</span><span></span>";
    t.lastChild.textContent = msg;
    box.appendChild(t);
    setTimeout(function () { t.classList.add("toast-out"); setTimeout(function () { t.remove(); }, 300); }, 4000);
  }

  function wireForm() {
    var form = $("#contactForm"); if (!form) return;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = Object.fromEntries(new FormData(form));
      var status = $("#formStatus"); status.hidden = true;
      var phoneOk = /^\+?[0-9\s\-().]{7,20}$/.test(String(f.phone || "").trim());
      if (!String(f.fullName || "").trim()) return notify("error", "Full Name is required");
      if (!String(f.email || "").trim()) return notify("error", "Email Address is required");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(f.email).trim())) return notify("error", "Please enter a valid email address");
      if (!String(f.phone || "").trim()) return notify("error", "Phone Number is required");
      if (!phoneOk) return notify("error", "Please enter a valid phone number (e.g. +1 234 567 890)");
      if (!f.service) return notify("error", "Please select a service");
      if (!String(f.description || "").trim()) return notify("error", "Project description is required");
      var btn = $("#sendBtn");
      btn.disabled = true;
      btn.innerHTML = ic("loader", "w-6 h-6 animate-spin") + "<span>Submitting...</span>";
      var body = ["Name: " + f.fullName, "Email: " + f.email, "Phone: " + f.phone, "Service: " + f.service, "Budget: " + (f.budget || "-"), "Deadline: " + (f.deadline || "-"), "", f.description].join("\n");
      var href = "mailto:" + String(state.data.profile.email || "").trim() + "?subject=" + encodeURIComponent("New project inquiry from " + f.fullName) + "&body=" + encodeURIComponent(body);
      setTimeout(function () {
        btn.disabled = false;
        btn.innerHTML = "<span>Send Message</span>" + ic("arrow-up-right", "w-6 h-6");
        status.className = "p-4 rounded-[1.2rem] mb-6 font-semibold text-sm bg-emerald-50 text-emerald-800 border border-emerald-100";
        status.innerHTML = 'Thanks! Your message is ready. <a class="underline font-black" target="_blank" rel="noreferrer" href="' + esc(href) + '">Open your email app</a> to send it, and I\'ll reply within 24 hours.';
        status.hidden = false;
        notify("success", "Message ready to send");
        form.reset();
      }, 900);
    });
  }

  function openLightbox(i) {
    var c = state.data.certificates[i];
    if (!c || !imgSrc(c.image)) return;
    $("#lbImg").src = imgSrc(c.image);
    $("#lbImg").alt = c.title || "";
    $("#lbCap").textContent = [c.title, c.issuer].filter(Boolean).join(", ");
    $("#lightbox").hidden = false;
    document.body.style.overflow = "hidden";
    $("[data-lb-close]").focus();
  }
  function closeLightbox() { var lb = $("#lightbox"); if (lb && !lb.hidden) { lb.hidden = true; document.body.style.overflow = ""; } }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t.closest) return;
    if ($("#admin") && $("#admin").contains(t)) return;
    if (t.closest("#svcHost")) {
      if (t.closest("[data-svc-close]")) { closeService(); return; }
      var vw = t.closest("[data-svc-view]");
      if (vw) { showServicePreview(+vw.getAttribute("data-svc-view")); return; }
      if (t.closest("[data-svc-preview-close]")) { showServicePreview(-1); return; }
      if (t.closest("[data-svc-start]")) { closeService(function () { setTimeout(function () { setActive("#contact"); scrollToHash("#contact"); }, 150); }); return; }
      return;
    }
    var sv = t.closest("[data-service]");
    if (sv) { openService(sv.getAttribute("data-service")); return; }
    var a = t.closest("a[href^='#']");
    if (a && a.getAttribute("href").length > 1) {
      e.preventDefault();
      var hash = a.getAttribute("href");
      if (a.hasAttribute("data-nav")) setActive(hash);
      if (t.closest("#drawer")) closeDrawer();
      scrollToHash(hash);
      return;
    }
    if (t.closest("#menuBtn")) { openDrawer(); return; }
    if (t.closest("[data-drawer-close]")) { closeDrawer(); return; }
    var cert = t.closest("[data-cert]");
    if (cert) { openLightbox(+cert.getAttribute("data-cert")); return; }
    if (t.closest("[data-lb-close]") || t.id === "lightbox") { closeLightbox(); return; }
    var oa = t.closest("[data-open-admin]");
    if (oa && state.owner) openAdmin(oa.getAttribute("data-open-admin") || state.tab);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (svc.id) { closeService(); return; }
    if (state.editing) { closeEditor(); return; }
    var lb = $("#lightbox");
    if (lb && !lb.hidden) { closeLightbox(); return; }
    var dw = $("#drawer");
    if (dw && !dw.hidden) { closeDrawer(); return; }
    if (state.adminOpen) closeAdmin();
  });

  /* the admin lives at /admin on this site; these stubs keep the site code simple */
  function openAdmin() {}
  function closeAdmin() {}
  function closeEditor() {}

  /* ---------- service popup (same layout and motion as the reference) ---------- */
  var svc = { id: null, preview: -1, lastFocus: null, closing: false };

  function serviceProjects(d, id) {
    return d.projects.filter(function (p) { return p.serviceId && p.serviceId === id; });
  }

  function mediaFor(p) {
    var file = videoSrc(p.video);
    if (file) return { kind: "video", src: file };
    var link = safeUrl(p.videoLink);
    if (link) {
      var m;
      if ((m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/i.exec(link))) return { kind: "iframe", src: "https://www.youtube.com/embed/" + m[1] + "?autoplay=1&rel=0" };
      if ((m = /vimeo\.com\/(?:video\/)?(\d+)/i.exec(link))) return { kind: "iframe", src: "https://player.vimeo.com/video/" + m[1] + "?autoplay=1" };
      if ((m = /loom\.com\/(?:share|embed)\/([\w-]+)/i.exec(link))) return { kind: "iframe", src: "https://www.loom.com/embed/" + m[1] + "?autoplay=1" };
      if ((m = /drive\.google\.com\/file\/d\/([\w-]+)/i.exec(link))) return { kind: "iframe", src: "https://drive.google.com/file/d/" + m[1] + "/preview" };
      if (/\.(mp4|webm|mov)(\?|#|$)/i.test(link)) return { kind: "video", src: link };
      return { kind: "iframe", src: link };
    }
    var img = imgSrc(p.image);
    return img ? { kind: "image", src: img } : null;
  }

  function servicePreviewHTML(p) {
    var media = mediaFor(p);
    var inner = !media ? '<div class="w-full h-full flex items-center justify-center text-white/40 text-sm font-semibold">No preview yet</div>'
      : media.kind === "video" ? '<video src="' + esc(media.src) + '" controls autoplay playsinline class="w-full h-full object-cover"></video>'
      : media.kind === "iframe" ? '<iframe src="' + esc(media.src) + '" title="' + esc(p.title) + '" class="w-full h-full" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>'
      : '<img src="' + esc(media.src) + '" alt="' + esc(p.title) + '" class="w-full h-full object-cover">';
    return '<div id="svcPreview" class="svc-pop mb-10 rounded-[2rem] border border-line bg-brand-dark text-white p-4 md:p-5 shadow-2xl">' +
      '<div class="flex items-start justify-between gap-4 mb-4"><div>' +
        '<p class="text-[10px] uppercase tracking-[0.25em] text-white/40 font-black mb-2">Video preview</p>' +
        '<h4 class="text-2xl font-black tracking-tight">' + esc(p.title) + "</h4></div>" +
        '<button type="button" data-svc-preview-close class="rounded-full border border-white/15 bg-white/5 px-4 py-2 text-xs font-black uppercase tracking-widest text-white/80 hover:bg-white/10 transition-colors">Close</button>' +
      "</div>" +
      '<div class="overflow-hidden rounded-[1.5rem] bg-black aspect-video">' + inner + "</div>" +
      "</div>";
  }

  function serviceBodyHTML() {
    var d = state.data;
    var s = d.services.filter(function (x) { return x.id === svc.id; })[0];
    if (!s) return "";
    var list = serviceProjects(d, s.id);
    var prev = svc.preview > -1 ? list[svc.preview] : null;
    var cards = list.map(function (p, i) {
      var tags = String(p.tags || "").split(",").map(function (t) { return t.trim(); }).filter(Boolean);
      var link = safeUrl(p.link), gh = safeUrl(p.github);
      var img = imgSrc(p.image)
        ? '<img src="' + imgSrc(p.image) + '" alt="' + esc(p.title) + '" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">'
        : '<div class="w-full h-full bg-brand-purple flex items-center justify-center"><span class="text-5xl font-black text-[#171717]/70 tracking-tighter">' + esc((p.title || "?").slice(0, 2)) + "</span></div>";
      return '<div class="group bg-muted rounded-[2rem] overflow-hidden flex flex-col shadow-sm hover:shadow-xl transition-all duration-300 border border-line">' +
        '<div class="aspect-[16/10] overflow-hidden relative">' + img +
          ((link || gh) ? '<div class="absolute inset-0 bg-[#171717]/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-4">' +
            (link ? '<a href="' + esc(link) + '" target="_blank" rel="noreferrer" aria-label="Open ' + esc(p.title) + '" class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-[#171717] hover:scale-110 transition-transform shadow-xl">' + ic("external-link", "w-5 h-5") + "</a>" : "") +
            (gh ? '<a href="' + esc(gh) + '" target="_blank" rel="noreferrer" aria-label="' + esc(p.title) + ' on GitHub" class="w-12 h-12 bg-[#171717] rounded-full flex items-center justify-center text-white hover:scale-110 transition-transform shadow-xl">' + ic("github", "w-5 h-5") + "</a>" : "") +
          "</div>" : "") +
        "</div>" +
        '<div class="p-8 flex flex-col flex-grow">' +
          (tags.length ? '<div class="flex flex-wrap gap-2 mb-4">' + tags.map(function (t) { return '<span class="text-[10px] font-black uppercase tracking-wider bg-surface px-3 py-1 rounded-full text-ink/40 border border-line shadow-sm">' + esc(t) + "</span>"; }).join("") + "</div>" : "") +
          '<h4 class="text-2xl font-black text-ink mb-2 tracking-tight">' + esc(p.title) + "</h4>" +
          '<p class="text-ink/50 text-sm leading-relaxed font-medium line-clamp-2">' + esc(p.description) + "</p>" +
          '<button type="button" data-svc-view="' + i + '" class="mt-auto pt-6 flex items-center gap-2 text-ink font-black text-sm group/btn w-fit">View ' + ic("arrow-up-right", "w-4 h-4 group-hover/btn:translate-x-1 group-hover/btn:-translate-y-1 transition-transform") + "</button>" +
        "</div>" +
        "</div>";
    }).join("");
    return '<div class="mb-12"><div class="flex flex-col gap-4">' +
        '<div class="bg-brand-purple/20 text-ink px-4 py-1.5 rounded-full w-fit text-xs font-black uppercase tracking-widest border border-brand-purple/30">Our Work</div>' +
        '<h2 id="svcTitle" class="text-4xl md:text-5xl font-black text-ink tracking-tighter">' + esc(s.title) + ' <span class="text-brand-purple italic font-light">Projects</span></h2>' +
        (s.description ? '<p class="text-ink/60 text-lg max-w-2xl font-medium leading-relaxed">' + esc(s.description) + "</p>" : "") +
      "</div></div>" +
      (prev ? servicePreviewHTML(prev) : "") +
      (list.length ? '<div class="grid grid-cols-1 md:grid-cols-2 gap-8">' + cards + "</div>"
        : '<div class="rounded-[2rem] border-2 border-dashed border-ink/15 p-10 text-center text-ink/50 font-semibold">Projects for this service are coming soon.' +
          (state.owner ? '<br><span class="text-xs opacity-70">Link projects to this service from the admin\'s Projects tab.</span>' : "") + "</div>") +
      '<div class="mt-16 pt-12 border-t border-line flex flex-col md:flex-row items-center justify-between gap-8">' +
        '<div class="text-center md:text-left"><p class="text-ink/30 uppercase font-black tracking-[0.2em] text-[10px] mb-2">Want to see more?</p>' +
        '<h5 class="text-2xl font-black text-ink">Let\'s build something <span class="text-brand-orange">together</span>.</h5></div>' +
        '<button type="button" data-svc-start class="bg-brand-dark text-white px-8 py-4 rounded-full font-black text-sm flex items-center gap-2 hover:bg-brand-dark/90 transition-all hover:scale-105 shadow-xl">Start a Project ' + ic("arrow-up-right", "w-4 h-4 text-brand-purple") + "</button>" +
      "</div>";
  }

  function openService(id) {
    var host = $("#svcHost");
    if (!host || !state.data.services.some(function (s) { return s.id === id; })) return;
    svc.id = id; svc.preview = -1; svc.closing = false;
    svc.lastFocus = document.activeElement;
    host.className = "";
    host.innerHTML = '<div class="fixed inset-0 z-[90]">' +
      '<div data-svc-close class="svc-overlay absolute inset-0 bg-black/80" aria-hidden="true"></div>' +
      '<div id="svcPanel" role="dialog" aria-modal="true" aria-labelledby="svcTitle" class="svc-panel absolute left-1/2 top-1/2 w-[calc(100%-2rem)] max-w-4xl max-h-[90vh] overflow-y-auto bg-surface rounded-[2.5rem] shadow-2xl">' +
        '<button type="button" data-svc-close class="absolute right-4 top-4 z-10 rounded-sm text-ink opacity-70 hover:opacity-100 transition-opacity focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-purple" aria-label="Close">' + ic("x", "w-4 h-4") + "</button>" +
        '<div id="svcBody" class="p-8 md:p-12">' + serviceBodyHTML() + "</div>" +
      "</div></div>";
    document.body.style.overflow = "hidden";
    var c = $("#svcPanel [data-svc-close]"); if (c) c.focus();
  }

  function showServicePreview(i) {
    var body = $("#svcBody"), panel = $("#svcPanel");
    if (!body) return;
    svc.preview = i;
    body.innerHTML = serviceBodyHTML();
    var pv = $("#svcPreview");
    if (pv && panel) panel.scrollTo({ top: Math.max(0, pv.offsetTop - 24), behavior: reduceMotion ? "auto" : "smooth" });
  }

  function closeService(after) {
    var host = $("#svcHost");
    if (!host || !svc.id || svc.closing) return;
    svc.closing = true;
    $$("#svcHost video").forEach(function (v) { try { v.pause(); } catch (e) {} });
    host.className = "closing";
    setTimeout(function () {
      host.innerHTML = ""; host.className = "";
      svc.id = null; svc.preview = -1; svc.closing = false;
      document.body.style.overflow = "";
      if (svc.lastFocus && svc.lastFocus.focus) { try { svc.lastFocus.focus({ preventScroll: true }); } catch (e) {} }
      if (after) after();
    }, reduceMotion ? 0 : 200);
  }

  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target && e.target.getAttribute && e.target.hasAttribute("data-service")) {
      e.preventDefault();
      openService(e.target.getAttribute("data-service"));
    }
  });

  /* ---------- boot ---------- */
  renderSite();
})();
</script>
</body>
</html>
